<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>

  <!-- Phase groups -->
  <!-- Phase 1: Foundations -->
  <rect x="20" y="30" width="280" height="360" rx="10" fill="#F4F6F8" stroke="#232F3E" stroke-width="1.5"/>
  <text x="160" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Foundations</text>
  <text x="160" y="76" text-anchor="middle" font-size="10" fill="#666">Modules 01-03</text>

  <!-- Phase 2: Core Infra -->
  <rect x="310" y="30" width="280" height="360" rx="10" fill="#FFF7EC" stroke="#FF9900" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Core Infrastructure</text>
  <text x="450" y="76" text-anchor="middle" font-size="10" fill="#666">Modules 04-08</text>

  <!-- Phase 3: Delivery & Ops -->
  <rect x="600" y="30" width="280" height="360" rx="10" fill="#F4F6F8" stroke="#232F3E" stroke-width="1.5"/>
  <text x="740" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Delivery &amp; Ops</text>
  <text x="740" y="76" text-anchor="middle" font-size="10" fill="#666">Modules 09-12</text>

  <!-- Phase 4: Resilience & Review -->
  <rect x="890" y="30" width="290" height="360" rx="10" fill="#FFF7EC" stroke="#FF9900" stroke-width="1.5"/>
  <text x="1035" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#232F3E">Resilience &amp; Review</text>
  <text x="1035" y="76" text-anchor="middle" font-size="10" fill="#666">Modules 13-15 + Appendix</text>

  <!-- Phase 1 items -->
  <g font-size="11.5" fill="#1a1a1a">
    <rect x="40" y="95" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="50" y="114">01 · Introduction &amp; Well-Architected</text>
    <rect x="40" y="135" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="50" y="154">02 · Simplest Architectures (S3)</text>
    <rect x="40" y="175" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="50" y="194">03 · Compute Layer (EC2 / EBS)</text>
  </g>

  <!-- Phase 2 items -->
  <g font-size="11.5" fill="#1a1a1a">
    <rect x="330" y="95" width="240" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="340" y="114">04 · Database Layer (RDS / DynamoDB)</text>
    <rect x="330" y="135" width="240" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="340" y="154">05 · Networking Part 1 (VPC)</text>
    <rect x="330" y="175" width="240" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="340" y="194">06 · Networking Part 2 (ELB / Route 53)</text>
    <rect x="330" y="215" width="240" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="340" y="234">07 · Identity &amp; Access (IAM)</text>
    <rect x="330" y="255" width="240" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="340" y="274">08 · Elasticity &amp; High Availability</text>
  </g>

  <!-- Phase 3 items -->
  <g font-size="11.5" fill="#1a1a1a">
    <rect x="620" y="95" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="630" y="114">09 · Automation (IaC)</text>
    <rect x="620" y="135" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="630" y="154">10 · Caching (CDN / ElastiCache)</text>
    <rect x="620" y="175" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="630" y="194">11 · Decoupled Architectures</text>
    <rect x="620" y="215" width="240" height="30" rx="5" fill="#ffffff" stroke="#ccc"/>
    <text x="630" y="234">12 · Microservices &amp; Serverless</text>
  </g>

  <!-- Phase 4 items -->
  <g font-size="11.5" fill="#1a1a1a">
    <rect x="910" y="95" width="250" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="920" y="114">13 · RTO/RPO &amp; Disaster Recovery</text>
    <rect x="910" y="135" width="250" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="920" y="154">14 · Optimizations &amp; Review</text>
    <rect x="910" y="175" width="250" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="920" y="194">15 · Course Wrap Up</text>
    <rect x="910" y="215" width="250" height="30" rx="5" fill="#ffffff" stroke="#f0b457"/>
    <text x="920" y="234">Appendix · Security Deep Dive</text>
  </g>

  <!-- arrows between phases -->
  <g stroke="#232F3E" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M300 210 L310 210"/>
    <path d="M590 210 L600 210"/>
    <path d="M880 210 L890 210"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#232F3E"/>
    </marker>
  </defs>
</svg>
